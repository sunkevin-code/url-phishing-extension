{id:"url_typosquat",w:20,t:function(u){var b=["google","facebook","youtube","paypal","amazon","netflix","microsoft","apple","binance","coinbase","metamask","instagram","twitter","whatsapp","telegram","discord","tiktok","linkedin","github","spotify","steam","alipay","weixin","baidu"];try{var h=new URL(u).hostname.toLowerCase().replace(/^www\./,"");var p=h.split("."),m=p[0];for(var i=0;i<b.length;i++){var x=b[i];if(m===x)continue;if(Math.abs(m.length-x.length)===1){if(lv(m,x)===1)return true}if(m.length===x.length){var df=0;for(var j=0;j<m.length;j++)if(m[j]!==x[j])df++;if(df===1)return true}}return false}catch(e){return false}}},

function ev(u){var s=0,g=[];for(var i=0;i<RL.length;i++){try{if(RL[i].t(u)){s+=RL[i].w;g.push(RL[i].id)}}catch(e){}}var t=g.join(",");if(t.indexOf("url_brand_sim")>-1&&t.indexOf("url_suspicious_tld")>-1)s+=8;if(t.indexOf("url_security_keywords")>-1&&t.indexOf("url_shortened")>-1)s+=6;if(t.indexOf("url_at_symbol")>-1)s+=4;if(t.indexOf("url_double_protocol")>-1)s+=5;if(t.indexOf("url_third_party")>-1&&t.indexOf("url_security_keywords")>-1)s+=10;if(t.indexOf("url_ip_host")>-1&&t.indexOf("url_security_keywords")>-1)s+=12;var l="safe";if(s>=55)l="high";else if(s>=28)l="medium";else if(s>=10)l="low";return{score:s,level:l,triggered:g}}
async function t1(u,lb){var r=ev(u);r.label=lb;r.url=u;return r}
async function runB(urls,c){var r=[],t=urls.length,i=0;async function n(){while(i<t){var idx=i++;var u=urls[idx];var rr=await t1(u.url,u.label);rr.idx=idx+1;r.push(rr);var tr=rr.triggered||[];for(var j=0;j<tr.length;j++){rc[tr[j]]=(rc[tr[j]]||0)+1}if(idx%50===0||idx===t)up("Progress: "+idx+"/"+t)}}var w=Math.min(c||4,4);var p=[];for(var ww=0;ww<w;ww++)p.push(n());await Promise.all(p);return{results:r,ruleCounts:rc}}
function calc(R){var tp=0,fp=0,tn=0,fn=0;for(var i=0;i<R.length;i++){var r=R[i];var ip=r.label==="phishing";var id=r.level!=="safe";if(ip&&id)tp++;else if(ip&&!id)fn++;else if(!ip&&id)fp++;else tn++}var t=tp+fp+tn+fn;return{total:t,tp:tp,fp:fp,tn:tn,fn:fn,dr:t>0?Math.round(tp/Math.max(1,tp+fn)*100):0,fpr:t>0?Math.round(fp/Math.max(1,fp+tn)*100):0,pr:tp+fp>0?Math.round(tp/(tp+fp)*100):0,rc:tp+fn>0?Math.round(tp/(tp+fn)*100):0,acc:t>0?Math.round((tp+tn)/t*100):0,f1:tp+fp+fn>0?Math.round(2*tp/(2*tp+fp+fn)*100):0}}
function rS(s){document.getElementById("metrics").style.display="grid";document.getElementById("mDR").textContent=s.dr+"%";document.getElementById("mFPR").textContent=s.fpr+"%";document.getElementById("mF1").textContent=s.f1+"%";document.getElementById("mAcc").textContent=s.acc+"%"}
function gV(r){if(r.label==="phishing")return r.level!=="safe"?["TP","bg-tp"]:["FN","bg-fn"];else return r.level==="safe"?["TN","bg-tn"]:["FP","bg-fp"]}
function gL(l){var m={high:["High","bg-hi"],medium:["Medium","bg-md"],low:["Low","bg-lo"],safe:["Safe","bg-sf"]};return m[l]||["Safe","bg-sf"]}
function rR(R){document.getElementById("resultsPanel").style.display="block";document.getElementById("btnExport").disabled=false;var h="";for(var i=0;i<R.length;i++){var r=R[i];var v=gV(r);var lb=gL(r.level);h+="<tr><td>"+(r.idx||i+1)+"</td><td title=""+r.url+"">"+r.url.substring(0,80)+"</td><td>"+r.label+"</td><td>"+r.score+"</td><td><span class='badge "+lb[1]+"'>"+lb[0]+"</span></td><td><span class='badge "+v[1]+"'>"+v[0]+"</span></td><td>"+(r.triggered||[]).slice(0,5).join(", ")+"</td></tr>"}document.getElementById("resultsBody").innerHTML=h}
async function qT(){if(tst){up("Already testing");return}tst=true;clr();var u=[];for(var i=0;i<PH.length;i++)u.push({url:PH[i],label:"phishing"});for(var i=0;i<BN.length;i++)u.push({url:BN[i],label:"benign"});try{var r=await runB(u,4);R=r.results;rc=r.ruleCounts;var s=calc(R);rS(s);rR(R);up("Done: "+R.length+" URLs | DR:"+s.dr+"% | FPR:"+s.fpr+"% | F1:"+s.f1+"%")}catch(e){up("Error: "+e.message)}tst=false}
async function mT(){if(tst)return;var t=document.getElementById("manualUrls").value.trim();if(!t){up("Paste URLs first");return}tst=true;clr();var ln=t.split("
"),ph=[],bn=[],cu="phishing";for(var i=0;i<ln.length;i++){var l=ln[i].trim();if(!l)continue;if(l.toLowerCase()==="#benign"||l.toLowerCase()==="#safe"){cu="benign";continue}if(l.toLowerCase()==="#phishing"){cu="phishing";continue}if(l.indexOf("http")===0){if(cu==="benign")bn.push(l);else ph.push(l)}}var u=[];for(var i=0;i<ph.length;i++)u.push({url:ph[i],label:"phishing"});for(var i=0;i<bn.length;i++)u.push({url:bn[i],label:"benign"});if(u.length===0){up("No valid URLs");tst=false;return}try{var r=await runB(u,4);R=r.results;rc=r.ruleCounts;var s=calc(R);rS(s);rR(R);up("Done: "+R.length+" URLs | DR:"+s.dr+"% | FPR:"+s.fpr+"%")}catch(e){up("Error: "+e.message)}tst=false}
